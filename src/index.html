<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Música</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/music.css" />
  <script>
    // tema antes do primeiro quadro, para não piscar branco no modo escuro
    try {
      const t = JSON.parse(localStorage.getItem('musica-theme') || '"auto"');
      const dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    } catch {}
  </script>
</head>
<body>
  <div id="ambient"></div>
  <div id="app">
    <aside id="sidebar" class="glass">
      <div class="side-top">
        <div class="grow" data-tauri-drag-region></div>
        <button class="gbtn round" id="side-toggle" title="Ocultar barra lateral (Ctrl+Alt+S)"></button>
      </div>
      <label class="side-search">
        <span id="search-ic"></span>
        <input id="search" type="search" placeholder="Buscar" spellcheck="false" autocomplete="off" />
      </label>
      <nav id="nav"></nav>
    </aside>

    <main id="main">
      <div id="view"></div>
      <div class="edge-top"></div>
      <div class="edge-bottom"></div>
      <header id="toolbar"></header>
      <div id="bottom"></div>
      <aside id="panel" class="glass"></aside>
    </main>
  </div>
  <div class="win-controls" id="winctl">
    <button class="w-min" title="Minimizar" aria-label="Minimizar"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6h8" /></svg></button>
    <button class="w-max" title="Maximizar" aria-label="Maximizar"><svg viewBox="0 0 12 12" aria-hidden="true"><rect x="2" y="2" width="8" height="8" rx="2.2" /></svg></button>
    <button class="w-close close" title="Fechar" aria-label="Fechar"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7" /></svg></button>
  </div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
