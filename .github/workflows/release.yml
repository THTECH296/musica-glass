name: Publicar instalador

# Compila o instalador nos servidores do GitHub, direto deste código, e publica junto
# o SHA-256 e um atestado de origem (build provenance) que qualquer pessoa pode conferir.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - run: npx tauri build

      - name: Nome do arquivo e SHA-256
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          Copy-Item $exe.FullName "dist/Musica-Glass-Setup-x64.exe"
          $hash = (Get-FileHash "dist/Musica-Glass-Setup-x64.exe" -Algorithm SHA256).Hash.ToLower()
          # quebra de linha 
 (LF) para o sha256sum -c do Linux/macOS também funcionar
          [IO.File]::WriteAllText("$PWD/dist/SHA256SUMS.txt", "$hash  Musica-Glass-Setup-x64.exe`n")
          Get-Content dist/SHA256SUMS.txt

      - name: Atestado de origem
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/Musica-Glass-Setup-x64.exe

      - name: Publicar na página de Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Musica-Glass-Setup-x64.exe
            dist/SHA256SUMS.txt
          body: |
            ## Baixar
            Baixe **Musica-Glass-Setup-x64.exe** abaixo e abra para instalar (Windows 10/11, 64 bits).

            Este instalador foi compilado pelo GitHub Actions a partir do código desta versão.
            Para conferir: veja a seção "Como saber se o instalador é seguro" no README.
          generate_release_notes: true
